name: "CD – Deploy to Staging"

# ─────────────────────────────────────────────────────────────────────────────
# TRIGGER: Runs when dev branch is merged into 'staging'.
# PURPOSE: Deploy validated changes to a Staging Fabric workspace for UAT.
#
# WORKFLOW:
#   dev  ──PR──►  staging  ──this workflow──►  Staging Workspace
#                                                     │
#                                              UAT / QA testing
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - staging
    paths:
      - "fabric_items/**"
      - "config/**"
      - "scripts/**"
  workflow_dispatch:

env:
  ENVIRONMENT: staging
  PYTHON_VERSION: "3.11"

jobs:
  deploy-staging:
    name: Deploy to Staging Workspace
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    environment:
      name: staging   # This GitHub Environment can require 1 reviewer approval

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Fabric items to Staging
        env:
          FABRIC_WORKSPACE_ID: ${{ secrets.STAGING_FABRIC_WORKSPACE_ID }}
          ENVIRONMENT: ${{ env.ENVIRONMENT }}
          DRY_RUN: "false"
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: python scripts/deploy.py

      # Run smoke tests against staging workspace after deployment
      - name: Run post-deploy smoke tests
        env:
          FABRIC_WORKSPACE_ID: ${{ secrets.STAGING_FABRIC_WORKSPACE_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: python scripts/smoke_tests.py

      - name: Notify stakeholders – staging ready for UAT
        if: success()
        uses: aliencube/microsoft-teams-actions@v0.8.0
        with:
          webhook_uri: ${{ secrets.TEAMS_WEBHOOK_URL }}
          title: "🚀 Staging Deployment Ready for UAT"
          summary: "Fabric Staging workspace updated. UAT testing can begin."
