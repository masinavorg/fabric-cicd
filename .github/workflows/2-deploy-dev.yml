name: "CD – Deploy to Development"

# ─────────────────────────────────────────────────────────────────────────────
# TRIGGER: Auto-deploys whenever code is pushed (merged) to the 'dev' branch.
# PURPOSE: Continuous Delivery to the Dev Fabric workspace.
#
# WORKFLOW:
#   feature/my-change  ──PR──►  dev  ──this workflow──►  Dev Workspace
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - dev
    paths:
      - "fabric_items/**"
      - "config/**"
      - "scripts/**"

  # Also allow manual trigger for re-deployments or hotfixes
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in dry-run mode (no actual changes)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

env:
  ENVIRONMENT: dev
  PYTHON_VERSION: "3.11"

jobs:
  deploy-dev:
    name: Deploy to Dev Workspace
    runs-on: ubuntu-latest

    # Grant minimal required permissions (principle of least privilege)
    permissions:
      contents: read
      id-token: write   # Required for OIDC federated identity (passwordless auth)

    environment:
      name: development   # Linked to GitHub Environment with secrets & protection rules

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── Authentication ────────────────────────────────────────────────────
      # Option A: Azure OIDC Federated Identity (recommended – no secrets stored)
      # Option B: Service Principal with client secret (see deploy.py for details)
      - name: Azure Login (OIDC / Workload Identity Federation)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # ─────────────────────────────────────────────────────────────────────

      - name: Deploy Fabric items to Dev
        env:
          FABRIC_WORKSPACE_ID: ${{ secrets.DEV_FABRIC_WORKSPACE_ID }}
          ENVIRONMENT: ${{ env.ENVIRONMENT }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: python scripts/deploy.py

      - name: Post-deploy notification (Teams)
        if: success()
        uses: aliencube/microsoft-teams-actions@v0.8.0
        with:
          webhook_uri: ${{ secrets.TEAMS_WEBHOOK_URL }}
          title: "✅ Fabric Dev Deployment Succeeded"
          summary: "Branch `${{ github.ref_name }}` deployed to Dev by @${{ github.actor }}"

      - name: Post-failure notification (Teams)
        if: failure()
        uses: aliencube/microsoft-teams-actions@v0.8.0
        with:
          webhook_uri: ${{ secrets.TEAMS_WEBHOOK_URL }}
          title: "❌ Fabric Dev Deployment FAILED"
          summary: "Branch `${{ github.ref_name }}` — see run ${{ github.run_id }}"
