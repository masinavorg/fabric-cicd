name: "CD – Deploy to Production"

# ─────────────────────────────────────────────────────────────────────────────
# TRIGGER: Runs when staging is merged into 'main' OR via manual approval.
# PURPOSE: Controlled, gated deployment to Production Fabric workspace.
#
# WORKFLOW:
#   staging  ──PR + 2 approvals──►  main  ──this workflow──►  Prod Workspace
#                                              │
#                                   ⚠️ Requires manual approval gate
#                                      (configured in GitHub Environments)
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - main
    paths:
      - "fabric_items/**"
      - "config/**"
      - "scripts/**"
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Type DEPLOY to confirm production deployment"
        required: true
        type: string

env:
  ENVIRONMENT: prod
  PYTHON_VERSION: "3.11"

jobs:
  # ── Gate: Confirm intent for manual triggers ──────────────────────────────
  confirm-deploy:
    name: Confirm Production Deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Verify confirmation input
        run: |
          if [ "${{ github.event.inputs.confirm_production }}" != "DEPLOY" ]; then
            echo "❌ Confirmation failed. You must type DEPLOY to proceed."
            exit 1
          fi
          echo "✅ Production deployment confirmed."

  # ── Main Deployment Job ───────────────────────────────────────────────────
  deploy-prod:
    name: Deploy to Production Workspace
    runs-on: ubuntu-latest
    needs: [confirm-deploy]
    if: always() && (needs.confirm-deploy.result == 'success' || github.event_name == 'push')

    permissions:
      contents: read
      id-token: write

    # ⚠️ This GitHub Environment is configured with:
    #    - Required reviewers (min 2 approvals before deployment runs)
    #    - Wait timer (e.g., 10 minutes to allow cancellation)
    #    - Deployment branch restrictions (only 'main' branch allowed)
    environment:
      name: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true   # Fabric REST APIs use workspace-level perms, not ARM RBAC

      # Take a snapshot of what is currently deployed (for rollback reference)
      - name: Pre-deploy snapshot (rollback reference)
        env:
          FABRIC_WORKSPACE_ID: ${{ secrets.PROD_FABRIC_WORKSPACE_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: python scripts/snapshot.py --workspace prod --label "pre-deploy-${{ github.sha }}"

      - name: Deploy Fabric items to Production
        env:
          FABRIC_WORKSPACE_ID: ${{ secrets.PROD_FABRIC_WORKSPACE_ID }}
          ENVIRONMENT: ${{ env.ENVIRONMENT }}
          DRY_RUN: "false"
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: python scripts/deploy.py

      - name: Post-deploy smoke tests (Production)
        env:
          FABRIC_WORKSPACE_ID: ${{ secrets.PROD_FABRIC_WORKSPACE_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: python scripts/smoke_tests.py

      - name: Notify – Production deployment succeeded
        if: success()
        uses: aliencube/microsoft-teams-actions@v0.8.0
        with:
          webhook_uri: ${{ secrets.TEAMS_WEBHOOK_URL }}
          title: "✅ PRODUCTION Deployment Succeeded"
          summary: |
            Commit: ${{ github.sha }}
            Actor: @${{ github.actor }}
            Fabric Workspace: Production

      - name: Notify – Production deployment FAILED
        if: failure()
        uses: aliencube/microsoft-teams-actions@v0.8.0
        with:
          webhook_uri: ${{ secrets.TEAMS_WEBHOOK_URL }}
          title: "🚨 PRODUCTION Deployment FAILED – Immediate action required"
          summary: |
            Run: ${{ github.run_id }}
            Commit: ${{ github.sha }}
            Please review logs and consider rollback.
