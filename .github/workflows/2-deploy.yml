name: "CD – Deploy (Dev → Staging → Prod)"

# ─────────────────────────────────────────────────────────────────────────────
# TRIGGER: Every push (merge) to the single 'main' branch.
# PURPOSE: Sequentially promote the same commit through Dev → Staging → Prod.
#          Staging and Prod each run only AFTER the previous environment
#          succeeds, and each is gated by its GitHub Environment
#          (reviewers, wait timer, branch restrictions).
#
# WORKFLOW:
#   feature/*  ──PR──►  main  ──this workflow──►  Dev  ──►  Staging  ──►  Prod
#                                                          (1 approver)   (2 approvers + wait)
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - main
    paths:
      - "fabric_items/**"
      - "config/**"
      - "scripts/**"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run Dev in dry-run mode (no actual changes)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      confirm_production:
        description: "Type DEPLOY to allow Production stage on manual runs"
        required: false
        default: ""
        type: string

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ── 1. Deploy to Dev (auto, no approval) ──────────────────────────────────
  deploy-dev:
    name: Deploy to Dev Workspace
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    environment:
      name: development

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Deploy Fabric items to Dev
        env:
          FABRIC_WORKSPACE_ID: ${{ secrets.DEV_FABRIC_WORKSPACE_ID }}
          ENVIRONMENT: dev
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: python scripts/deploy.py

  # ── 2. Deploy to Staging (only after Dev succeeds) ────────────────────────
  deploy-staging:
    name: Deploy to Staging Workspace
    runs-on: ubuntu-latest
    needs: [deploy-dev]

    permissions:
      contents: read
      id-token: write

    environment:
      name: staging   # Configure 1 required reviewer in GitHub Environment settings

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Deploy Fabric items to Staging
        env:
          FABRIC_WORKSPACE_ID: ${{ secrets.STAGING_FABRIC_WORKSPACE_ID }}
          ENVIRONMENT: staging
          DRY_RUN: "false"
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: python scripts/deploy.py

      - name: Run post-deploy smoke tests
        env:
          FABRIC_WORKSPACE_ID: ${{ secrets.STAGING_FABRIC_WORKSPACE_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: python scripts/smoke_tests.py

  # ── 3a. Manual-trigger guard: require typed confirmation for Prod ─────────
  confirm-prod:
    name: Confirm Production Deployment
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Verify confirmation token
        run: |
          if [ "${{ github.event.inputs.confirm_production }}" != "DEPLOY" ]; then
            echo "❌ Manual Production deploys require confirm_production = 'DEPLOY'."
            exit 1
          fi
          echo "✅ Confirmation token accepted."

  # ── 3b. Deploy to Production (after Staging + manual approval) ────────────
  deploy-prod:
    name: Deploy to Production Workspace
    runs-on: ubuntu-latest
    needs: [deploy-staging, confirm-prod]
    # Run when: push to main (skips confirm-prod via always()) OR manual dispatch where confirm-prod succeeded.
    if: |
      always() &&
      needs.deploy-staging.result == 'success' &&
      (github.event_name == 'push' || needs.confirm-prod.result == 'success')

    permissions:
      contents: read
      id-token: write

    # ⚠️ Configure the 'production' GitHub Environment with:
    #    - Required reviewers (min 2 approvals before deployment runs)
    #    - Wait timer (e.g., 10 minutes to allow cancellation)
    #    - Deployment branch restrictions (only 'main' branch allowed)
    environment:
      name: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Pre-deploy snapshot (rollback reference)
        env:
          FABRIC_WORKSPACE_ID: ${{ secrets.PROD_FABRIC_WORKSPACE_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: python scripts/snapshot.py --workspace prod --label "pre-deploy-${{ github.sha }}"

      - name: Deploy Fabric items to Production
        env:
          FABRIC_WORKSPACE_ID: ${{ secrets.PROD_FABRIC_WORKSPACE_ID }}
          ENVIRONMENT: prod
          DRY_RUN: "false"
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: python scripts/deploy.py

      - name: Post-deploy smoke tests (Production)
        env:
          FABRIC_WORKSPACE_ID: ${{ secrets.PROD_FABRIC_WORKSPACE_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: python scripts/smoke_tests.py
